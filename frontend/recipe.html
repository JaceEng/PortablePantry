<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe - Portable Pantry</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#129360;</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="nav">
    <h1>Portable Pantry</h1>
    <a class="btn small ghostbtn back" href="index.html">&larr; Back to recipes</a>
  </header>

  <main class="single recipe-page">
    <p id="status" role="status">Loading recipe...</p>

    <article id="recipe" hidden>
      <!-- Top: picture on the left, name and category on the right -->
      <section class="panel recipe-header">
        <img id="image" class="recipe-image" alt="" hidden>
        <div class="recipe-heading">
          <p id="category" class="recipe-category" hidden></p>
          <h2 id="title"></h2>
          <p id="description" class="recipe-description"></p>
          <ul class="meta" id="meta"></ul>
          <p class="estimate" id="estimate"></p>
        </div>
      </section>

      <!-- Below: ingredients on the left, steps on the right -->
      <div class="recipe-cols">
        <section class="panel ingredients-panel">
          <h2>Ingredients</h2>
          <div class="servings">
            <label for="servingsInput">Servings</label>
            <input type="number" id="servingsInput" min="1" max="100" value="2">
          </div>
          <ul id="ingredients" class="ingredient-list"></ul>
        </section>
        <section class="panel steps-panel">
          <h2>Steps</h2>
          <p class="hint">Tap a step to check it off as you cook.</p>
          <ol id="steps" class="step-list"></ol>
        </section>
      </div>

      <section class="panel" id="actions" hidden>
        <h2>Your recipe options</h2>
        <div class="row">
          <button type="button" id="saveBtn">Save recipe</button>
          <button type="button" id="completedBtn" class="ghost">Mark as completed</button>
        </div>
        <div class="row">
          <span>Your rating:</span>
          <span class="stars" id="stars"></span>
        </div>
        <label class="note-label" for="noteInput">Personal note (only you can see it)</label>
        <textarea id="noteInput" maxlength="2000" placeholder="Ingredient substitutions, cooking tips..."></textarea>
        <div class="row" style="margin-top:10px;">
          <button type="button" id="noteBtn" class="ghost">Save note</button>
        </div>
        <p id="actionStatus" role="status"></p>
      </section>

      <section class="panel" id="guestNote" hidden>
        <p style="margin:0 0 12px;">Log in or sign up to save this recipe, rate it, add notes, and mark it as completed.</p>
        <button type="button" id="guestLoginBtn">Log in or sign up</button>
      </section>
    </article>
  </main>

  <script src="js/core.js"></script>
  <script src="js/recipe.js"></script>
</body>
</html>
