<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Portable Pantry</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      color: #222;
      background: #fff;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid #ccc;
    }

    .nav h1 { font-size: 1.3rem; margin: 0; flex: 1; }
    .nav a { color: inherit; }

    main {
      max-width: 400px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      border: 1px solid #ccc;
      padding: 20px;
    }

    .panel h2 { margin-top: 0; font-size: 1.1rem; }

    label.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    label.check { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 0.9rem; }

    input[type=email], input[type=password], input[type=text] { font-size: 1rem; padding: 8px; }
    button { font-size: 1rem; padding: 8px; width: 100%; cursor: pointer; }

    #status { min-height: 1.2em; margin: 0 0 12px; }
    #status.error { color: #b00020; }

    .links { margin-top: 16px; font-size: 0.9rem; line-height: 1.6; }
  </style>
</head>
<body>

  <header class="nav">
    <h1>Portable Pantry</h1>
    <a href="index.html">Back to recipes</a>
  </header>

  <main>
    <section class="panel">
      <h2>Log in</h2>
      <p id="status" role="status"></p>

      <form id="loginForm">
        <label class="field">Email
          <input type="email" id="emailInput" autocomplete="email" required>
        </label>

        <label class="field">Password
          <input type="password" id="passwordInput" autocomplete="current-password" required>
        </label>

        <label class="check">
          <input type="checkbox" id="showPassword"> Show password
        </label>

        <button type="submit" id="loginBtn">Log in</button>
      </form>

      <p class="links">
        No account yet? <a href="signup.html">Sign up</a>
      </p>
    </section>
  </main>

  <script>
    // Empty string = the same server the page was loaded from (Flask serves the frontend).
    const API_URL = "";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const showPassword = document.getElementById("showPassword");
    const loginBtn = document.getElementById("loginBtn");
    const statusEl = document.getElementById("status");

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "";
    }

    // Show or hide the password
    showPassword.addEventListener("change", () => {
      passwordInput.type = showPassword.checked ? "text" : "password";
    });

    // Submit the login form
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setStatus("Enter your email and password.", true);
        return;
      }

      setStatus("Logging in...", false);
      loginBtn.disabled = true;

      try {
        const response = await fetch(API_URL + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          setStatus(data.error || "Incorrect email or password.", true);
          return;
        }

        // Keep the login token for later requests, if the backend sends one.
        if (data.access_token) sessionStorage.setItem("token", data.access_token);
        const u = data.user || {};
        sessionStorage.setItem("username", data.username || u.username || u.name || email.split("@")[0]);
        sessionStorage.removeItem("welcomed");
        sessionStorage.removeItem("guest");
        window.location.href = "index.html";
      } catch (err) {
        setStatus("Could not reach the server. Check that the backend is running.", true);
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
